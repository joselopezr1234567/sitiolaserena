databases:
  - name: sitiolaserena-db
    plan: free
    databaseName: pizzeria_db
    user: pizzeria

services:
  - type: web
    name: sitiolaserena-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sitiolaserena-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://TU_DOMINIO_DEL_FRONTEND
      - key: CORS_ORIGIN
        value: https://TU_DOMINIO_DEL_FRONTEND
