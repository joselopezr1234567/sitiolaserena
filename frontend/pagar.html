<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagar Pedido</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.jpeg" type="image/jpeg">
</head>
<body style="background:#0e0e0e;color:#fff;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:680px;margin:40px auto;padding:20px;border:2px solid #FF0000;border-radius:8px;background:#111">
    <h1 style="color:#FFD700;margin-top:0">Pagar con Webpay</h1>
    <p>Revisa tu carrito y presiona el botón para pagar con Webpay Plus.</p>
    <div id="resumen" style="margin:15px 0;border:1px solid #333;padding:12px;border-radius:6px"></div>
    <button id="btnPagar" style="background:#00FF00;color:#fff;border:none;padding:12px 18px;font-weight:bold;border-radius:6px;cursor:pointer">
      Pagar con Webpay
    </button>
    <button id="btnVolver" style="background:#555;color:#fff;border:none;padding:12px 18px;font-weight:bold;border-radius:6px;cursor:pointer;margin-left:8px">
      Volver
    </button>
  </div>
  <div id="aviso-retiro" style="position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px">
    <div style="width:min(420px,100%);background:#c00000;color:#fff;border:3px solid #fff;border-radius:4px;padding:24px 20px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,0.45)">
      <p style="margin:0 0 18px;font-size:1.1rem;line-height:1.5;font-weight:bold">Esta pagina es solo para agendar retiros en el local</p>
      <button id="btnAceptarAviso" type="button" style="background:#fff;color:#c00000;border:none;padding:10px 24px;font-weight:bold;font-size:1rem;cursor:pointer">
        Aceptar
      </button>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="pago.js"></script>
  <script>
    const overlayAviso = document.getElementById('aviso-retiro');
    const btnAceptarAviso = document.getElementById('btnAceptarAviso');
    let accionPendiente = null;

    function mostrarAvisoRetiro(accion) {
      accionPendiente = accion;
      overlayAviso.style.display = 'flex';
    }

    function cerrarAvisoRetiro() {
      overlayAviso.style.display = 'none';
    }

    function pintarResumen() {
      const cont = document.getElementById('resumen');
      const carrito = JSON.parse(localStorage.getItem('carrito') || '[]');
      if (!carrito.length) {
        cont.innerHTML = '<p style="color:#aaa">No tienes productos en el carrito.</p>';
        return;
      }
      let total = 0;
      const items = carrito.map(it => {
        const p = parseInt(it.precio, 10) || 0;
        total += p;
        return `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:6px 0">
          <span>${(it.nombre || it.producto_nombre || 'Producto').toUpperCase()}</span>
          <strong>$${p.toLocaleString()}</strong>
        </div>`;
      }).join('');
      cont.innerHTML = items + `<div style="text-align:right;margin-top:10px;font-size:1.1rem;color:#FFD700">
        TOTAL: $${total.toLocaleString()}
      </div>`;
    }
    pintarResumen();
    document.getElementById('btnPagar').onclick = () => {
      const sucursal = localStorage.getItem('ultima_sucursal')?.includes('coquimbo') ? 'coquimbo' : 'la_serena';
      const usuario = localStorage.getItem('usuario_nombre') || 'Invitado';
      const telefono = localStorage.getItem('usuario_telefono') || '';
      mostrarAvisoRetiro(() => pagarCarritoConWebpay(sucursal, usuario, telefono));
    };
    document.getElementById('btnVolver').onclick = () => {
      const ultima = localStorage.getItem('ultima_sucursal') || 'index.html';
      window.location.href = ultima;
    };
    btnAceptarAviso.onclick = () => {
      const accion = accionPendiente;
      accionPendiente = null;
      cerrarAvisoRetiro();
      if (typeof accion === 'function') {
        accion();
      }
    };
    overlayAviso.addEventListener('click', (event) => {
      if (event.target === overlayAviso) {
        accionPendiente = null;
        cerrarAvisoRetiro();
      }
    });
  </script>
</body>
</html>
