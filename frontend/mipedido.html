<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Pedido - Pizzería</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-conchevino">

    <nav class="navbar">
        <div class="auth-links" id="navbar-auth"></div>
    </nav>

    <header>
        <h1>HISTORIAL DE TUS PEDIDOS</h1>
    </header>

    <main class="contenedor-historial" id="lista-pedidos-usuario">
        <div style="text-align: center; padding: 50px;">
            <p style="color: #FFD700; font-size: 1.2rem;">Cargando tus pedidos...</p>
        </div>
    </main>

    <div class="footer-btns">
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
    </div>

    <script src="config.js"></script>
    <script src="auth-navbar.js"></script>
    <script>
        async function cargarPedidos() {
            const nombreUsuario = localStorage.getItem('usuario_nombre');
            const contenedor = document.getElementById('lista-pedidos-usuario');

            if (!nombreUsuario) {
                sessionStorage.setItem('post_login_redirect', 'mipedido.html');
                window.location.href = 'login.html';
                return;
            }

            try {
                const baseUrl = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) ? window.APP_CONFIG.API_BASE_URL : 'http://localhost:3000';
                const response = await fetch(`${baseUrl}/api/usuarios/${nombreUsuario}/pedidos`);
                if (response.ok) {
                    const pedidos = await response.json();

                    if (pedidos.length === 0) {
                        contenedor.innerHTML = `
                            <div style="text-align: center; padding: 40px; background-color: #111; border: 2px solid #FF0000; border-radius: 8px;">
                                <i class="fas fa-receipt" style="font-size: 3rem; color: #FF0000; margin-bottom: 20px;"></i>
                                <p class="texto-rojo">Aún no has realizado ningún pedido.</p>
                                <a href="index.html" class="btn-rojo" style="display: inline-block; width: auto; margin-top: 20px; padding: 10px 20px;">Hacer un Pedido</a>
                            </div>
                        `;
                        return;
                    }

                    let html = "";
                    pedidos.forEach(pedido => {
                        let statusText = "ESTADO: " + (pedido.estado || "desconocido");
                        let statusColor = "#FFD700";

                        if (pedido.estado === "pendiente_pago") {
                            statusText = "Pendiente de pago";
                            statusColor = "#FFD700";
                        } else if (pedido.estado === "pagado") {
                            statusText = "Pago recibido";
                            statusColor = "#00FF00";
                        } else if (pedido.estado === "rechazado") {
                            statusText = "Pago rechazado";
                            statusColor = "#FF0000";
                        } else if (pedido.estado === "preparando") {
                            statusText = "¡Tu pizza se está preparando!";
                            statusColor = "#FF8C00";
                        } else if (pedido.estado === "listo") {
                            statusText = "¡Tu pizza está lista para la entrega!";
                            statusColor = "#00FF00";
                        } else if (pedido.estado === "pendiente") {
                            statusText = "Recibido - Esperando aceptación";
                            statusColor = "#FFD700";
                        }

                        // Cálculo de hora estimada
                        let horaEstimadaHtml = "";
                        if (pedido.demora_estimada && pedido.estado !== "listo") {
                            const fechaPedido = new Date(pedido.fecha);
                            const fechaEstimada = new Date(fechaPedido.getTime() + pedido.demora_estimada * 60000);
                            const hora = fechaEstimada.getHours().toString().padStart(2, '0');
                            const mins = fechaEstimada.getMinutes().toString().padStart(2, '0');
                            horaEstimadaHtml = `
                                <p style="color: #FFD700; font-weight: bold; margin-top: 10px;">
                                    <i class="fas fa-clock"></i> Entrega estimada: ${hora}:${mins} (${pedido.demora_estimada} min)
                                </p>
                            `;
                        }

                        html += `
                            <div class="tarjeta-pedido" style="background: rgba(17, 17, 17, 0.78); border: 1px solid rgba(255, 0, 0, 0.65); border-radius: 18px; padding: 20px; margin-bottom: 30px; color: white; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px);">
                                <div style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div>
                                        <h2 style="color: #FFD700; margin: 0; font-size: 1.4rem;">Pedido #${pedido.id}</h2>
                                        <p style="color: #aaa; font-size: 0.8rem; margin: 5px 0;">Fecha: ${new Date(pedido.fecha).toLocaleString()}</p>
                                        ${horaEstimadaHtml}
                                    </div>
                                    <div style="text-align: right;">
                                        <span style="color: ${statusColor}; font-weight: bold; font-size: 0.9rem; display: block;">${statusText}</span>
                                        <span style="color: #aaa; font-size: 0.8rem;">Sucursal: ${pedido.sucursal || 'No especificada'}</span>
                                    </div>
                                </div>
                                
                                <div class="productos-pedido">
                        `;

                        pedido.productos.forEach(item => {
                            const precio = typeof item.precio === 'number' ? item.precio : parseInt(item.precio.toString().replace(/[^0-9]/g, '')) || 0;
                            html += `
                                <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222;">
                                    <div style="flex-grow: 1;">
                                        <span style="display: block; font-weight: bold; color: #FF0000;">${item.producto_nombre}</span>
                                        <span style="display: block; font-size: 0.75rem; color: #aaa;">${item.detalles || ''}</span>
                                    </div>
                                    <span style="font-weight: bold;">$${precio.toLocaleString()}</span>
                                </div>
                            `;
                        });

                        html += `
                                </div>
                                <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #333; text-align: right; font-size: 1.2rem; font-weight: bold; color: #FFD700;">
                                    TOTAL: $${pedido.total.toLocaleString()}
                                </div>
                            </div>
                        `;
                    });

                    contenedor.innerHTML = html;
                } else {
                    contenedor.innerHTML = "<p class='texto-rojo'>Error al obtener tus pedidos.</p>";
                }
            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p class='texto-rojo'>Error de conexión con el servidor.</p>";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarPedidos();
            // Actualizar el historial automáticamente cada 15 segundos
            setInterval(cargarPedidos, 15000);
        });
    </script>
</body>
</html>
